version: '3.8'

services:
  web:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # 必填：不设不安全默认值；未提供时 compose 直接报错
      - AUTH_SECRET=${AUTH_SECRET:?必须设置 AUTH_SECRET（至少 16 字符）}
      - CORS_ORIGIN=${CORS_ORIGIN:?生产必须显式设置 CORS_ORIGIN}
      - OLLAMA_API_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen:7b}
      - PSYQA_CHROMA_ENABLED=${PSYQA_CHROMA_ENABLED:-0}
      - CHROMA_URL=http://chroma:8000
      - PSYQA_QDRANT_ENABLED=${PSYQA_QDRANT_ENABLED:-1}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=psyqa_knowledge
      - QDRANT_VECTOR_SIZE=1024
      # bge-m3 / bge-reranker 为本机 Python 服务，容器外运行，经宿主机访问
      - LOCAL_BGE_URL=${LOCAL_BGE_URL:-http://host.docker.internal:8091}
      - LOCAL_RERANK_URL=${LOCAL_RERANK_URL:-http://host.docker.internal:8092}
      - PSYQA_SERVE_CLIENT=1
      - TRUST_PROXY=1
    volumes:
      - psyqa_data:/app/server/data
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  chroma:
    profiles: ["chroma"]
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  ollama:
    driver: local
  chroma_data:
    driver: local
  qdrant_data:
    driver: local
  psyqa_data:
    driver: local
